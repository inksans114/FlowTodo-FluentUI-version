name: Build Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install runtime and builder
        run: python -m pip install -r requirements.txt "PyInstaller>=6,<7"
      - name: Verify version and run offline tests
        shell: pwsh
        run: |
          $version = python -c "from version import APP_VERSION; print(APP_VERSION)"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and application version differ' }
          python -m unittest discover -s tests
          if ($LASTEXITCODE -ne 0) { throw 'Offline tests failed' }
          python tools/prepare_supervision_models.py
          if ($LASTEXITCODE -ne 0) { throw 'Model verification failed' }
          python tools/build_check.py --builder pyinstaller
          if ($LASTEXITCODE -ne 0) { throw 'Source preflight failed' }
      - name: Build complete Windows application
        shell: cmd
        run: build_pyinstaller.bat --no-run --no-zip
      - name: Verify package and isolated startup
        shell: pwsh
        run: |
          $folder = Get-ChildItem dist-pyinstaller -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $exe = Join-Path $folder.FullName 'FlowTodo/FlowTodo.exe'
          $env:FLOWTODO_DATA_DIR = Join-Path $env:RUNNER_TEMP 'flowtodo-smoke/data'
          $env:FLOWTODO_RINUI_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'flowtodo-smoke/rinui'
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Packaged startup timed out' }
          if ($process.ExitCode -ne 0) { throw "Packaged startup failed: $($process.ExitCode)" }
          python package_release.py $exe
          if ($LASTEXITCODE -ne 0) { throw 'Archive creation failed' }
          $zip = Get-ChildItem $folder.FullName -Filter 'FlowTodo-Windows-x64-*.zip' | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip.FullName).Hash.ToLower()
          "$hash  $($zip.Name)" | Set-Content -Encoding utf8 -LiteralPath (Join-Path $folder.FullName 'SHA256SUMS.txt')
      - uses: actions/upload-artifact@v4
        with:
          name: FlowTodo-Windows-x64
          path: |
            dist-pyinstaller/*/FlowTodo-Windows-x64-*.zip
            dist-pyinstaller/*/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = python -c "from version import APP_VERSION; print(APP_VERSION)"
          $zip = Get-ChildItem dist-pyinstaller -Recurse -Filter 'FlowTodo-Windows-x64-*.zip' | Select-Object -First 1
          $checksums = Join-Path $zip.DirectoryName 'SHA256SUMS.txt'
          gh release create $env:GITHUB_REF_NAME --verify-tag --draft --title "FlowTodo $version · 让想法，有下一步" --notes-file "docs/releases/$version.md"
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
          gh release upload $env:GITHUB_REF_NAME $zip.FullName $checksums
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
